<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}T-Invest Dashboard{% endblock %}</title>

    <style>
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }
        nav a {
            color: #4da6ff;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        nav a:hover {
            color: #80c1ff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Навигационное меню -->
    <nav>
        <a href="/">💼 Портфель</a>
        <a href="#">📰 Новости</a>
        <a href="#">📊 Облигации</a>
        <a href="#">📅 Купоны</a>
    </nav>

    <!-- Основной контент страницы будет подставляться сюда -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
