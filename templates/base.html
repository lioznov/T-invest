{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ИНВЕСТПРО — Терминал</title>
    <!-- Шрифт Inter из макета -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ПРАВИЛЬНОЕ подключение CSS в Django -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Фоновые свечения -->
    <div class="bg-glow glow-top-right"></div>
    <div class="bg-glow glow-bottom-left"></div>

    <div class="container">
        <!-- НАВИГАЦИЯ В СТИЛЕ МАКЕТА -->
        <!-- НАВИГАЦИЯ В СТИЛЕ МАКЕТА -->
        <header class="header" id="header">
            <!-- Левый блок: Логотип -->
            <div class="logo"><strong>ИНВЕСТ</strong>ПРО</div>

            <!-- Центральный блок: Навигация -->
                <div class="nav-links">
                    <!-- Твой текущий терминал (один стакан + график) -->
                    <a href="/" class="nav-item {% block nav_terminal %}{% endblock %}">Терминал</a>

                    <!-- НОВАЯ ССЫЛКА НА ГАЛЕРЕЮ СТАКАНОВ -->
                    <a href="/radar/" class="nav-item {% block nav_radar %}{% endblock %}">Радар</a>

                    <!-- Твой портфель -->
                    <a href="/portfolio/" class="nav-item {% block nav_portfolio %}{% endblock %}">Портфель</a>
                </div>

            <!-- Правый блок: Профиль (создает баланс для центровки) -->
            <div class="user-profile">
                <span class="user-name">Профиль</span>
                <div class="avatar">П</div>
            </div>
        </header>

        <!-- Место под уникальные страницы -->
        {% block content %}{% endblock %}
    </div>

    <!-- ПРАВИЛЬНОЕ подключение JS в Django -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
