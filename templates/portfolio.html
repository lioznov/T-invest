{% extends "base.html" %}

{% block nav_portfolio %}active{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    /* ФИКС ТРЯСКИ 1: Добавляем запас хода внизу страницы, чтобы скролл не дергался */
    body {
        padding-bottom: 50px !important;
    }

    /* ФИКС ТРЯСКИ 2: Жесткая капсула для графика */
    .chart-card {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 260px;
        overflow: hidden; /* Обрезаем любые микро-изменения размера */
    }

    .chart-wrapper {
        position: relative;
        width: 100%;
        height: 230px; /* Строго фиксированная высота внутри капсулы */
    }
</style>
{% endblock %}

{% block content %}
<div class="top-row">
    <!-- Цифры -->
    <div class="panel summary-card">
        <div class="summary-item">
            <div>Общая стоимость портфеля</div>
            <div class="summary-value" id="totalCost">0.00 ₽</div>
        </div>
        <div class="summary-item">
            <div>Общая доходность</div>
            <div class="summary-value" id="totalYield">0.00 ₽</div>
        </div>
    </div>

    <!-- Кольцевой график -->
    <div class="panel chart-card">
        <div class="chart-wrapper">
            <canvas id="portfolioChart"></canvas>
        </div>
    </div>
</div>

<div class="panel">
    <h3 style="margin-bottom: 15px; color: var(--text-dark);">Ваши активы</h3>
    <table>
        <thead>
            <tr>
                <th>FIGI / Акция</th>
                <th>Тип</th>
                <th class="right-align">Кол-во</th>
                <th class="right-align">Ср. цена</th>
                <th class="right-align">Тек. цена</th>
                <th class="right-align">Стоимость</th>
                <th class="right-align">Доходность</th>
            </tr>
        </thead>
        <tbody id="portfolioBody">
            <tr><td colspan="7" style="text-align: center; color: var(--text-gray);">Загрузка портфеля...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const TYPE_NAMES = { 'share': 'Акции', 'currency': 'Валюта', 'bond': 'Облигации', 'etf': 'Фонды', 'futures': 'Фьючерсы', 'other': 'Другое' };
    let portfolioChart = null;

    function renderChart(positions) {
        const typeTotals = {};
        positions.forEach(p => {
            const key = p.instrument_type || 'other';
            typeTotals[key] = (typeTotals[key] || 0) + p.total_sum;
        });

        const labels = Object.keys(typeTotals).map(k => TYPE_NAMES[k] || k);
        const dataValues = Object.values(typeTotals);

        if (portfolioChart) portfolioChart.destroy();
        const ctx = document.getElementById('portfolioChart').getContext('2d');

        portfolioChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    backgroundColor: ['#006D5B', '#059669', '#34d399', '#f59e0b', '#8b5cf6', '#3b82f6'],
                    borderColor: 'transparent',
                    borderWidth: 0,
                    borderRadius: 10,
                    spacing: 4,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                layout: {
                    padding: 10
                },
                plugins: {
                    legend: { position: 'right', labels: { color: '#4b5563', font: { family: 'Inter', size: 13 } } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                if (label) label += ': ';
                                if (context.parsed !== null) {
                                    label += new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(context.parsed);
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });
    }

    function loadPortfolio() {
        fetch('/api/portfolio/')
            .then(res => res.json())
            .then(data => {
                if (data.status === "error") return;

                document.getElementById('totalCost').innerText = data.total_portfolio_cost.toLocaleString('ru-RU', {style: 'currency', currency: 'RUB'});

                const yieldElem = document.getElementById('totalYield');
                const isProf = data.expected_yield_rubles >= 0;
                const sign = isProf && data.expected_yield_rubles > 0 ? "+" : "";
                yieldElem.innerText = `${sign}${data.expected_yield_rubles.toFixed(2)} ₽ (${sign}${data.expected_yield_percent.toFixed(2)}%)`;
                yieldElem.className = "summary-value " + (isProf ? "positive" : "negative");

                renderChart(data.positions);

                const tbody = document.getElementById('portfolioBody');
                tbody.innerHTML = '';
                data.positions.forEach(p => {
                    const isP = p.expected_yield >= 0;
                    const yClass = isP ? "positive" : "negative";
                    const s = isP && p.expected_yield > 0 ? "+" : "";
                    const typeName = TYPE_NAMES[p.instrument_type] || p.instrument_type;

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${p.figi}</b></td>
                            <td style="color: var(--text-gray);">${typeName}</td>
                            <td class="right-align">${p.quantity} шт.</td>
                            <td class="right-align">${p.average_price.toFixed(2)} ₽</td>
                            <td class="right-align">${p.current_price.toFixed(2)} ₽</td>
                            <td class="right-align">${p.total_sum.toFixed(2)} ₽</td>
                            <td class="right-align ${yClass}">${s}${p.expected_yield.toFixed(2)} ₽ (${s}${p.yield_percent.toFixed(2)}%)</td>
                        </tr>
                    `;
                });
            });
    }

    loadPortfolio();
</script>
{% endblock %}
