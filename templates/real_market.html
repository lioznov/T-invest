{% extends "base.html" %}

{% block nav_terminal %}active{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
{% endblock %}

{% block content %}
<div class="controls-bar panel">
    <div class="stock-info">
        <div class="stock-icon" id="iconTicker">S</div>
        <div class="stock-name" id="displayTicker">SBER</div>
    </div>
    <div class="controls">

        <!-- УМНЫЙ ПОИСК -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск (тикер, имя)..." autocomplete="off" oninput="debounceSearch()">
            <input type="hidden" id="figiInput" value="BBG004730N88">
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>

        <select id="timeframeSelect" onchange="changeTimeframe()">
            <optgroup label="Секунды">
                <option value="5s">5 секунд</option>
                <option value="10s">10 секунд</option>
                <option value="30s">30 секунд</option>
            </optgroup>
            <optgroup label="Минуты">
                <option value="1m" selected>1 минута</option>
                <option value="2m">2 минуты</option>
                <option value="3m">3 минуты</option>
                <option value="5m">5 минут</option>
                <option value="10m">10 минут</option>
                <option value="15m">15 минут</option>
                <option value="30m">30 минут</option>
            </optgroup>
            <optgroup label="Часы">
                <option value="1h">1 час</option>
                <option value="2h">2 часа</option>
                <option value="4h">4 часа</option>
            </optgroup>
            <optgroup label="Дни">
                <option value="1d">1 день</option>
                <option value="1w">1 неделя</option>
                <option value="1M">1 месяц</option>
            </optgroup>
        </select>

        <select id="depthSelect" onchange="changeDepth()">
            <option value="10">10 строк</option>
            <option value="20">20 строк</option>
            <option value="30">30 строк</option>
            <option value="50" selected>50 строк</option>
        </select>
    </div>
</div>

<div id="alertBox" class="alert-box">Ожидание инициализации...</div>

<div class="main-grid">
    <div class="panel panel-chart">
        <div id="chart-container">График ожидает подключения...</div>
    </div>

    <div class="panel panel-book">
        <div class="volumes-header">
            <div class="vol-buy" id="totalBids">0 ₽</div>
            <div class="vol-total" id="totalVolume" style="font-size: 12px; color: var(--text-gray);">0 ₽</div>
            <div class="vol-sell" id="totalAsks">0 ₽</div>
        </div>

        <table class="orderbook-table">
            <thead>
                <tr>
                    <th class="col-bid-price">Покупка, ₽</th>
                    <th class="col-bid-vol">Объем</th>
                    <th class="col-ask-vol">Объем</th>
                    <th class="col-ask-price">Продажа, ₽</th>
                </tr>
            </thead>
            <tbody id="orderbookBody">
                <!-- Сюда вставляются строки -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const LOT_SIZE = 10;
    let trackerInterval = null, chart = null, candleSeries = null;
    let currentHistoricalCandle = null, isFetching = false, isChartBroken = false;
    let currentDepth = 50;
    let searchTimeout = null;

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 500);
    }

    function performSearch() {
        const query = document.getElementById('searchInput').value;
        const dropdown = document.getElementById('searchDropdown');

        if (query.length < 2) {
            dropdown.style.display = 'none';
            return;
        }

        fetch(`/api/search/?q=${query}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok' && data.results.length > 0) {
                    dropdown.innerHTML = '';
                    data.results.forEach(item => {
                        dropdown.innerHTML += `
                            <div class="search-item" onclick="selectInstrument('${item.figi}', '${item.ticker}', '${item.name}')">
                                <span class="search-item-ticker">${item.ticker} (${item.type})</span>
                                <span class="search-item-name">${item.name}</span>
                            </div>
                        `;
                    });
                    dropdown.style.display = 'block';
                } else {
                    dropdown.innerHTML = '<div class="search-item"><span class="search-item-name">Ничего не найдено</span></div>';
                    dropdown.style.display = 'block';
                }
            });
    }

    function selectInstrument(figi, ticker, name) {
        document.getElementById('figiInput').value = figi;
        document.getElementById('searchInput').value = ticker;
        document.getElementById('searchDropdown').style.display = 'none';

        document.getElementById('displayTicker').innerText = ticker;
        document.getElementById('iconTicker').innerText = ticker.charAt(0).toUpperCase();

        startTracking(); // Перезапускаем поток с новой акцией
    }

    document.addEventListener('click', function(e) {
        if (!document.getElementById('searchInput').contains(e.target)) {
            document.getElementById('searchDropdown').style.display = 'none';
        }
    });

    function initChart() {
        const container = document.getElementById('chart-container');
        if (typeof LightweightCharts === 'undefined') { isChartBroken = true; return; }
        container.innerHTML = '';
        chart = LightweightCharts.createChart(container, {
            autoSize: true,
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#4b5563' },
            grid: { vertLines: { color: 'rgba(0,0,0,0.05)' }, horzLines: { color: 'rgba(0,0,0,0.05)' } },
            timeScale: { timeVisible: true, secondsVisible: true },
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#059669', downColor: '#dc2626', borderVisible: false,
            wickUpColor: '#059669', wickDownColor: '#dc2626'
        });
        isChartBroken = false;
    }

    function fetchHistory(figi, tf) {
        if (isChartBroken) return;
        fetch(`/api/history/?figi=${figi}&tf=${tf}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok' && data.candles.length > 0) {
                    candleSeries.setData(data.candles);
                    currentHistoricalCandle = data.candles[data.candles.length - 1];
                }
            });
    }

    function changeTimeframe() { fetchHistory(document.getElementById('figiInput').value, document.getElementById('timeframeSelect').value); }
    function changeDepth() { currentDepth = parseInt(document.getElementById('depthSelect').value); }
    function formatMillions(rubles) { return (rubles / 1_000_000).toFixed(1) + 'М ₽'; }

    function fetchRealData() {
        if (isFetching) return;
        isFetching = true;

        const figi = document.getElementById('figiInput').value;
        const alertBox = document.getElementById('alertBox');

        fetch(`/api/real-data/?figi=${figi}`)
            .then(res => res.json())
            .then(data => {
                // Если статус loading, значит Питону нужно еще пару секунд на подключение к бирже
                if (data.status === "loading") {
                    isFetching = false;
                    return;
                }
                if (data.status === "error") {
                    isFetching = false;
                    return;
                }

                if (data.is_calibrating) {
                    alertBox.className = 'alert-box alert-calibrating';
                    alertBox.innerHTML = '⏳ Идет калибровка емкости стакана (30 сек)...';
                } else if (data.is_anomaly) {
                    alertBox.className = 'alert-box alert-danger';
                    alertBox.innerHTML = `🚨 ${data.anomaly_msg}`;
                } else {
                    alertBox.className = 'alert-box';
                    alertBox.innerHTML = '⚡ Прямой эфир активен';
                }

                document.getElementById('totalBids').innerText = formatMillions(data.total_bid_rubles);
                document.getElementById('totalAsks').innerText = formatMillions(data.total_ask_rubles);
                document.getElementById('totalVolume').innerText = "ОБЩИЙ ОБЪЕМ: " + formatMillions(data.total_volume);

                if (!isChartBroken && data.current_price > 0 && candleSeries && currentHistoricalCandle) {
                    currentHistoricalCandle.close = data.current_price;
                    if (data.current_price > currentHistoricalCandle.high) currentHistoricalCandle.high = data.current_price;
                    if (data.current_price < currentHistoricalCandle.low) currentHistoricalCandle.low = data.current_price;
                    candleSeries.update(currentHistoricalCandle);
                }

                let visibleAsks = data.asks.slice(0, currentDepth);
                let visibleBids = data.bids.slice(0, currentDepth);

                let maxVolume = 0;
                visibleAsks.forEach(a => { if (a.quantity > maxVolume) maxVolume = a.quantity; });
                visibleBids.forEach(b => { if (b.quantity > maxVolume) maxVolume = b.quantity; });
                if (maxVolume === 0) maxVolume = 1;

                const threshBid = data.dynamic_whale_bid || 100000000;
                const threshAsk = data.dynamic_whale_ask || 100000000;

                const tbody = document.getElementById('orderbookBody');
                tbody.innerHTML = '';

                const rowCount = Math.max(visibleBids.length, visibleAsks.length);

                for (let i = 0; i < rowCount; i++) {
                    const bid = visibleBids[i];
                    const ask = visibleAsks[i];

                    let trHtml = '<tr>';

                    if (bid) {
                        const isWhale = (bid.price * bid.quantity * LOT_SIZE) >= threshBid;
                        const fillPercent = (bid.quantity / maxVolume) * 100;
                        const bg = isWhale ? '#ffd60a' : `linear-gradient(to left, rgba(5, 150, 105, 0.25) ${fillPercent}%, transparent ${fillPercent}%)`;
                        const textStyle = isWhale ? 'color: #000 !important; font-weight: bold;' : '';

                        trHtml += `
                            <td class="col-bid-price bid-price" style="${textStyle} ${isWhale ? 'background-color:#ffd60a;' : ''}">${bid.price.toFixed(2)}</td>
                            <td class="col-bid-vol" style="background: ${bg}; ${textStyle}">${bid.quantity}</td>
                        `;
                    } else {
                        trHtml += `<td colspan="2"></td>`;
                    }

                    if (ask) {
                        const isWhale = (ask.price * ask.quantity * LOT_SIZE) >= threshAsk;
                        const fillPercent = (ask.quantity / maxVolume) * 100;
                        const bg = isWhale ? '#ffd60a' : `linear-gradient(to right, rgba(220, 38, 38, 0.25) ${fillPercent}%, transparent ${fillPercent}%)`;
                        const textStyle = isWhale ? 'color: #000 !important; font-weight: bold;' : '';

                        trHtml += `
                            <td class="col-ask-vol" style="background: ${bg}; ${textStyle}">${ask.quantity}</td>
                            <td class="col-ask-price ask-price" style="${textStyle} ${isWhale ? 'background-color:#ffd60a;' : ''}">${ask.price.toFixed(2)}</td>
                        `;
                    } else {
                        trHtml += `<td colspan="2"></td>`;
                    }

                    trHtml += '</tr>';
                    tbody.innerHTML += trHtml;
                }

            }).finally(() => { isFetching = false; });
    }

    function startTracking() {
        if (trackerInterval) clearInterval(trackerInterval);
        const figi = document.getElementById('figiInput').value;

        // === ВИЗУАЛЬНАЯ ОЧИСТКА ПРИ ПЕРЕКЛЮЧЕНИИ ===
        document.getElementById('orderbookBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-gray);">Подключение к потоку биржи...</td></tr>';
        document.getElementById('totalBids').innerText = '0 ₽';
        document.getElementById('totalAsks').innerText = '0 ₽';
        document.getElementById('totalVolume').innerText = 'ОБЩИЙ ОБЪЕМ: 0 ₽';

        initChart();
        fetchHistory(figi, document.getElementById('timeframeSelect').value);
        fetchRealData();
        trackerInterval = setInterval(fetchRealData, 300);
    }

    window.onload = startTracking;
</script>
{% endblock %}
