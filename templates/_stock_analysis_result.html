<section class="panel analysis-result" aria-labelledby="instrument-name">
  <header class="analysis-result-heading">
    <span id="ticker-avatar" class="ticker-avatar" aria-hidden="true">S</span>
    <div><h2 id="instrument-name">SBER</h2><p id="ticker-label">SBER · TQBR</p></div>
  </header>
  <div class="analysis-result-grid">
    <div class="analysis-quote">
      <h3>Последняя доступная цена</h3>
      <strong id="price">—</strong>
      <p id="price-change">Загружаем котировку…</p>
    </div>
    <div id="forecast-overview" class="analysis-forecast" aria-live="polite">
      <h3>Прогноз на следующее утро</h3>
      <strong id="forecast-overview-price">Загружаем прогноз…</strong>
      <p id="forecast-overview-detail"></p>
      <p id="forecast-overview-change" hidden></p>
      <p id="forecast-overview-range" hidden></p>
      <p id="forecast-overview-direction" hidden></p>
      <a class="analysis-forecast-link" href="#morning-forecast">Как рассчитан прогноз <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>
