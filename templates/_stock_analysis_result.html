<section class="panel analysis-result" aria-labelledby="instrument-name">
  <header class="analysis-result-heading">
    <span id="ticker-avatar" class="ticker-avatar" aria-hidden="true">S</span>
    <div><h2 id="instrument-name">SBER</h2><p id="ticker-label">SBER · TQBR</p></div>
  </header>
  <div class="analysis-result-grid">
    <div class="analysis-quote">
      <h3>Последняя доступная цена</h3>
      <strong id="price">—</strong>
      <p id="price-change">Загружаем котировку…</p>
      <strong id="forecast-anchor-price" hidden></strong>
      <p id="forecast-anchor-source" hidden></p>
    </div>
    <div id="forecast-overview" class="analysis-forecast">
      <h3 id="forecast-overview-label">Расчётная цена на следующее торговое утро</h3>
      <strong id="forecast-overview-price">—</strong>
      <p id="forecast-overview-detail" hidden></p>
      <p id="forecast-overview-change" hidden></p>
      <p id="forecast-overview-range" hidden></p>
      <p id="forecast-overview-direction" hidden></p>
      <p id="forecast-overview-actual" hidden></p>
      <p id="forecast-job-status" role="status">Загружаем состояние…</p>
      <form id="forecast-job-form" class="forecast-job-actions" aria-describedby="forecast-job-status">
        {% csrf_token %}
        <button id="forecast-run" class="button primary" type="submit" disabled>Рассчитать прогноз</button>
        <button id="forecast-compare" class="button forecast-compare" type="button" hidden>Проверить фактическую цену</button>
      </form>
      <a class="analysis-forecast-link" href="#morning-forecast">Архив и качество модели <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>
